services:
  kb:
    build: .
    container_name: everstake-kb
    restart: unless-stopped
    ports:
      - "127.0.0.1:4320:4320"
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: 4320
    volumes:
      # data/kb.db is the built index (crawl → dedup → index → facts). Build it locally with
      # `npm run pipeline`, then mount it here; the container only serves and answers.
      - ${KB_DATA_DIR:-./data}:/data

  # The incremental re-check (`src/refresh/schedule.ts`), in its own process against the same
  # database. Deliberately not enabled inside `kb`: a refresh holds the SQLite write lock while it
  # re-embeds, and the scheduler's overlap guard is per process, so exactly one container may run
  # it. See deploy/README.md. Stop it with `docker compose stop refresher` — the API is unaffected.
  refresher:
    build: .
    container_name: everstake-kb-refresher
    restart: unless-stopped
    command: ["node", "dist/refresh/schedule.js"]
    env_file: .env
    environment:
      DATA_DIR: /data
      REFRESH_SCHEDULER: "1"
    volumes:
      - ${KB_DATA_DIR:-./data}:/data
    depends_on:
      - kb
