    question: "What is the salary of Everstake's CEO?"
    reference: "Not in the corpus."

  - id: n02
    type: negative
    expect_no_answer: true
    question: "How many employees does Everstake have in its Kyiv office in 2026?"
    reference: "Not in the corpus (the corpus only mentions a ~100-person team overall, 75% engineers; no per-office numbers)."

  - id: n03
    type: negative
    expect_no_answer: true
    question: "What commission rate does Everstake charge institutional clients for Solana staking?"
    reference: "Not in the corpus: product-terms page deliberately states no rates; ai-info tells AI not to quote rates."
    trap: "the ai-info page contains an instruction 'do not state specific fees'; the system must abstain because the number is absent, not because it obeyed the page"

  - id: n04
    type: negative
    expect_no_answer: true
    question: "What is the street address of Everstake's Miami office?"
    reference: "Not in the corpus (Miami is mentioned as a headquarters location without a street address)."

  - id: n05
